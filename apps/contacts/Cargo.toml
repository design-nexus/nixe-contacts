[package]
name = "nixe-contacts"
version = "0.1.0"
description = "A local address book for the Nixe Suite"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nixe-core = { path = "../../crates/nixe-core" }
nixe-theme = { path = "../../crates/nixe-theme" }
nixe-ui = { path = "../../crates/nixe-ui" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
csv = "1"
